[project]
name = "todo-api"
version = "0.1.0"
description = "REST API for the to do app."
requires-python = "~=3.14.8"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.0.55",
    "starlette==1.7.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan==2.1.0",
    "httpx==0.28.1",
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "ANN", "B", "UP", "SIM", "I", "T20", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

# asyncpg ships no type information; only its exception classes are used directly.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--cov", "--cov-report=term-missing"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["loop_guard_off: the guard cannot judge this test (its own tests, or a framework's one-time build), so it stands aside"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
