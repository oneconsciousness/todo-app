# Scales the API between 1 and 2 pods on CPU: a pod is added when the pods average over 70% of their CPU request.
# Two keeps a laptop comfortable. For a heavy load test, raise maxReplicas; the database allows up to 5
# (5 pods × 15 connections = 75, under 80% of Postgres's 100).
# https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Add pods as soon as load rises; remove them only after two quiet minutes, so a dip does not flap the count.
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120
